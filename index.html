    <script>
      // Gracefully ignore Vite dev server WebSocket/HMR transport errors in cloud preview environments
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('@vite/client') ||
          msg.includes('createWebSocketModuleRunnerTransport')
        ) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = (e && (e.message || e.filename || '')) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('@vite/client') ||
          msg.includes('createWebSocketModuleRunnerTransport')
        ) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 overflow-hidden select-none font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
